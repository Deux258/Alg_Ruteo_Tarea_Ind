name: path-discovery

services:
  tools:
    image: ${PD_TOOL_IMAGE:-path-discovery-tools:20260902}
    build:
      context: .
      dockerfile: docker/Dockerfile.tools
    profiles: [tools]
    network_mode: host
    cap_add: [NET_RAW]
    working_dir: /work
    volumes:
      - .:/work
    environment:
      TZ: UTC
    restart: "no"
    command: [scamper, -v]

  atlas:
    image: jamesits/ripe-atlas@sha256:841459abe5aac56833e94832b2460423b5b9532b6420df73bfec54dd3303643b
    container_name: path-discovery-atlas
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW, KILL, SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    environment:
      RXTXRPT: "no"
      HTTP_POST_PORT: "18080"
      TELNETD_PORT: "12023"
    volumes:
      - atlas_etc:/etc/ripe-atlas
      - atlas_run:/run/ripe-atlas
      - atlas_spool:/var/spool/ripe-atlas
    mem_limit: 64m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

volumes:
  atlas_etc:
    external: true
    name: pd-atlas-etc
  atlas_run:
    external: true
    name: pd-atlas-run
  atlas_spool:
    external: true
    name: pd-atlas-spool
