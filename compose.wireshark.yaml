name: path-discovery
services:
  wireshark:
    image: ${PD_WIRESHARK_IMAGE:?Ejecutar scripts/preparar_wireshark.py para fijar el digest}
    container_name: path-discovery-wireshark
    profiles: [gui]
    ports:
      - "127.0.0.1:8767:3000"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      TITLE: "Wireshark - Path Discovery"
    volumes:
      - wireshark_config:/config
      - ./datos/originales:/captures:ro
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
volumes:
  wireshark_config:
