services:
  latex:
    build:
      context: .
      dockerfile: docker/latex.Dockerfile
    image: path-discovery-latex:bookworm
    working_dir: /work/informe/latex
    user: "${PD_UID:-1000}:${PD_GID:-1000}"
    network_mode: none
    environment:
      SOURCE_DATE_EPOCH: "1793114149"
      FORCE_SOURCE_DATE: "1"
    volumes:
      - .:/work
    command: ["latexmk", "-pdf", "-interaction=nonstopmode", "-halt-on-error", "-outdir=build", "main.tex"]
